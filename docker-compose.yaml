services:
  flask:
    build: .
    image: deanalemao/flask-task:${IMAGE_TAG}
      - "5000"
    env_file:
      - ./.env.flask
    networks:
      - flask-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    expose:
      - "5432"
    env_file:
      - ./.env.postgres
    networks:
      - flask-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskmanager"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - flask-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      flask:
        condition: service_started

    restart: unless-stopped

networks:
  flask-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local
